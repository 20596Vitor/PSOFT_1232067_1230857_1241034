openapi: 3.0.3
info:
  title: US202 - Registar Modelo com Imagem
  version: 1.0
paths:
  /api/aircraft-models:
    post:
      tags:
        - Aircraft Models
      summary: "Registar modelo de aeronave com imagem opcional (US202)"
      description: Regista um novo modelo, suportando o upload de um ficheiro de imagem ou diagrama técnico via multipart/form-data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                model:
                  type: object
                  description: Objeto JSON com os dados do modelo (manufacturer, modelName, etc.)
                image:
                  type: string
                  format: binary
                  description: Ficheiro de imagem opcional (JPG, PNG)
      responses:
        '201':
          description: Modelo registado com sucesso
        '400':
          description: Erro na validação dos dados