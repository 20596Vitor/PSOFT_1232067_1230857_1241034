openapi: 3.0.3
info:
  title: US201 - Especificações de Aeronave
  version: 1.0
paths:
  /api/aircraft-models/{id}:
    patch:
      tags:
        - Aircraft Models
      summary: "Atualizar especificações de um modelo de aeronave (US201)"
      description: Atualiza campos específicos (alcance, velocidade, etc.) de um modelo existente.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manufacturer:
                  type: string
                modelName:
                  type: string
                cruisingSpeed:
                  type: number
                  format: float
                fuelCapacity:
                  type: number
                  format: float
                maxRange:
                  type: number
                  format: float
      responses:
        '200':
          description: Modelo atualizado com sucesso
        '400':
          description: Dados inválidos (ex. valores negativos)
        '404':
          description: Modelo não encontrado