openapi: 3.0.3
info:
  title: AlSafe API - US104 Pesquisar Aeronaves
  version: 1.0.0
  description: Documento para o requisito funcional de listar e filtrar aeronaves por modelo, ano ou estado.
servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento Local

paths:
  /api/aircrafts:
    get:
      summary: Pesquisar aeronaves com filtros
      operationId: searchAircrafts
      parameters:
        - name: modelName
          in: query
          required: false
          description: Filtrar pelo nome do modelo (ex. 737 MAX 8)
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filtrar pelo estado operacional
          schema:
            type: string
            enum:
              - ACTIVE
              - IN_FLIGHT
              - UNDER_MAINTENANCE
              - INACTIVE
        - name: year
          in: query
          required: false
          description: Filtrar pelo ano de fabrico (ex. 2023)
          schema:
            type: integer
      responses:
        '200':
          description: Lista de aeronaves que correspondem aos filtros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Aircraft'

components:
  schemas:
    Aircraft:
      type: object
      properties:
        id:
          type: integer
          example: 1
        registrationNumber:
          type: string
          example: "CS-TKA"
        manufacturingDate:
          type: string
          format: date
          example: "2023-01-15"
        seatingCapacity:
          type: integer
          example: 189
        status:
          type: string
          example: "ACTIVE"
        aircraftModel:
          type: object
          properties:
            id:
              type: integer
              example: 1
            manufacturer:
              type: string
              example: "Boeing"
            modelName:
              type: string
              example: "737 MAX 8"
            cruisingSpeed:
              type: number
              example: 839.0
            fuelCapacity:
              type: number
              example: 25941.0
            maxRange:
              type: number
              example: 6570.0