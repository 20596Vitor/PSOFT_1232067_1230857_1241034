openapi: 3.0.3
info:
  title: AlSafe API - US102 Registar Aeronave
  version: 1.0.0
  description: Documento para o requisito funcional de registar novas aeronaves na frota.
servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento Local

paths:
  /api/aircrafts:
    post:
      summary: Registar uma nova aeronave física
      operationId: registerAircraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAircraftRequest'
      responses:
        '201':
          description: Aeronave criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aircraft'
        '400':
          description: Erro de validação ou matrícula já existente.

components:
  schemas:
    CreateAircraftRequest:
      type: object
      required:
        - registrationNumber
        - manufacturingDate
        - seatingCapacity
        - status
        - modelId
      properties:
        registrationNumber:
          type: string
          example: "CS-TKA"
        manufacturingDate:
          type: string
          format: date
          example: "2023-01-15"
        seatingCapacity:
          type: integer
          example: 189
        status:
          type: string
          enum:
            - ACTIVE
            - IN_FLIGHT
            - UNDER_MAINTENANCE
            - INACTIVE
          example: "ACTIVE"
        modelId:
          type: integer
          example: 1
          description: ID do modelo de aeronave associado.

    Aircraft:
      type: object
      properties:
        id:
          type: integer
          example: 1
        registrationNumber:
          type: string
          example: "CS-TKA"
        manufacturingDate:
          type: string
          format: date
          example: "2023-01-15"
        seatingCapacity:
          type: integer
          example: 189
        status:
          type: string
          example: "ACTIVE"
        aircraftModel:
          type: object
          properties:
            id:
              type: integer
              example: 1
            manufacturer:
              type: string
              example: "Boeing"
            modelName:
              type: string
              example: "737 MAX 8"
            cruisingSpeed:
              type: number
              example: 839.0
            fuelCapacity:
              type: number
              example: 25941.0
            maxRange:
              type: number
              example: 6570.0
        _links:
          type: object
          description: Links hipermédia para navegação (HATEOAS).
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
                  example: "http://localhost:8080/api/aircrafts/CS-TKA"
            update-status:
              type: object
              properties:
                href:
                  type: string
                  example: "http://localhost:8080/api/aircrafts/CS-TKA/status"