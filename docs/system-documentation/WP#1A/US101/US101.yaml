openapi: 3.0.3
info:
  title: AlSafe API - US101 Registar Modelo de Aeronave
  version: 1.0.0
  description: Documento para o requisito funcional de registar modelos de aeronaves.
servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento Local

paths:
  /api/aircraft-models:
    post:
      summary: Registar um novo modelo de aeronave
      operationId: registerAircraftModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AircraftModel'
      responses:
        '201':
          description: Modelo de aeronave criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AircraftModel'
        '400':
          description: Erro de validação nos dados (ex. valores negativos).

components:
  schemas:
    AircraftModel:
      type: object
      required:
        - manufacturer
        - modelName
        - cruisingSpeed
        - fuelCapacity
        - maxRange
      properties:
        id:
          type: integer
          example: 1
          description: ID gerado automaticamente.
        manufacturer:
          type: string
          example: "Boeing"
        modelName:
          type: string
          example: "737 MAX 8"
        cruisingSpeed:
          type: number
          format: float
          example: 839.0
        fuelCapacity:
          type: number
          format: float
          example: 25941.0
        maxRange:
          type: number
          format: float
          example: 6570.0