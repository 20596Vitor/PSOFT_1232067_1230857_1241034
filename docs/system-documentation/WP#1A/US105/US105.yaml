openapi: 3.0.3
info:
  title: AlSafe API - US105 Atualizar Estado da Aeronave
  version: 1.0.0
  description: Documento para o requisito funcional de atualizar o estado operacional (ex. manutenção, em voo).
servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento Local

paths:
  /api/aircrafts/{registrationNumber}/status:
    patch:
      summary: Atualizar o estado operacional de uma aeronave
      operationId: updateAircraftStatus
      parameters:
        - name: registrationNumber
          in: path
          required: true
          description: Matrícula única da aeronave
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Estado atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aircraft'
        '404':
          description: Aeronave não encontrada.

components:
  schemas:
    UpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - IN_FLIGHT
            - UNDER_MAINTENANCE
            - INACTIVE
          example: "UNDER_MAINTENANCE"

    Aircraft:
      type: object
      properties:
        id:
          type: integer
          example: 1
        registrationNumber:
          type: string
          example: "CS-TKA"
        manufacturingDate:
          type: string
          format: date
          example: "2023-01-15"
        seatingCapacity:
          type: integer
          example: 189
        status:
          type: string
          example: "UNDER_MAINTENANCE"
        aircraftModel:
          type: object
          properties:
            id:
              type: integer
              example: 1
            manufacturer:
              type: string
              example: "Boeing"
            modelName:
              type: string
              example: "737 MAX 8"
            cruisingSpeed:
              type: number
              example: 839.0
            fuelCapacity:
              type: number
              example: 25941.0
            maxRange:
              type: number
              example: 6570.0