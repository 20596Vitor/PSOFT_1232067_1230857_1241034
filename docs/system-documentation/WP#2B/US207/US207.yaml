openapi: 3.0.3
info:
  title: AISafe API - US207 Register Airport with Facilities
  version: 1.0.0
  description: Register an airport with optional terminal, gate, service, contact info and operational hours.
servers:
  - url: http://localhost:8080

paths:
  /api/airports:
    post:
      summary: Register a new airport with optional facilities (US207)
      operationId: registerAirportWithFacilities
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AirportRequest'
            example:
              iataCode: "OPO"
              name: "Aeroporto Francisco Sá Carneiro"
              city: "Porto"
              country: "Portugal"
              type: "comercial"
              gate: "A1"
              terminal: "Terminal 1"
              service: "WiFi"
              email: "opo@ana.pt"
              phoneNumber: "+351229432400"
              openTime: "05:00"
              closeTime: "23:59"
      responses:
        '201':
          description: Airport registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirportResponse'
        '400':
          description: Validation error or IATA code already exists.
        '403':
          description: Not authorized.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AirportRequest:
      type: object
      required: [iataCode, name, city, country]
      properties:
        iataCode:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: "OPO"
        name:
          type: string
          example: "Aeroporto Francisco Sá Carneiro"
        city:
          type: string
          example: "Porto"
        country:
          type: string
          example: "Portugal"
        type:
          type: string
          example: "comercial"
        gate:
          type: string
          description: Optional gate identifier.
          example: "A1"
        terminal:
          type: string
          description: Optional terminal name.
          example: "Terminal 1"
        service:
          type: string
          description: Optional service available at airport.
          example: "WiFi"

    AirportResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        iataCode:
          type: string
          example: "OPO"
        name:
          type: string
          example: "Aeroporto Francisco Sá Carneiro"
        city:
          type: string
          example: "Porto"
        country:
          type: string
          example: "Portugal"
        status:
          type: string
          example: "OPERATIONAL"
        gate:
          type: object
          properties:
            gate:
              type: string
              example: "A1"
        terminal:
          type: object
          properties:
            terminal:
              type: string
              example: "Terminal 1"
        contactInfo:
          type: object
          properties:
            email:
              type: string
            phoneNumber:
              type: string
        operationalHours:
          type: object
          properties:
            openTime:
              type: string
            closeTime:
              type: string
        certifiedAirplaneModels:
          type: array
          items:
            type: string