openapi: 3.0.3
info:
  title: AlSafe API - US110 Criar Rota de Voo
  version: 1.0.0
  description: Documento para o requisito funcional de criar uma nova rota de voo entre dois aeroportos.
servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento Local

paths:
  /api/routes:
    post:
      summary: Criar uma nova rota de voo
      operationId: createRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequest'
      responses:
        '201':
          description: Rota de voo criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          description: Erro de validação (ex. aeroportos não existem, rota duplicada ou valores menores ou iguais a zero).

components:
  schemas:
    CreateRouteRequest:
      type: object
      required:
        - originIata
        - destinationIata
        - estimatedTime
        - minRange
        - minCapacity
      properties:
        originIata:
          type: string
          example: "LIS"
          description: Código IATA do aeroporto de origem (3 letras).
        destinationIata:
          type: string
          example: "OPO"
          description: Código IATA do aeroporto de destino (3 letras).
        estimatedTime:
          type: integer
          example: 45
          description: Tempo estimado de voo em minutos.
        minRange:
          type: number
          format: float
          example: 300.5
          description: Alcance mínimo exigido para a aeronave.
        minCapacity:
          type: integer
          example: 100
          description: Capacidade mínima de passageiros exigida.

    Route:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          description: ID único da rota gerado automaticamente (UUID).
        originIataCode:
          type: string
          example: "LIS"
        destinationIataCode:
          type: string
          example: "OPO"
        estimatedFlightTime:
          type: integer
          example: 45
        minRange:
          type: number
          format: float
          example: 300.5
        minCapacity:
          type: integer
          example: 100
        active:
          type: boolean
          example: true
        version:
          type: integer
          example: 0