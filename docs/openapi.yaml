openapi: 3.0.3
info:
  title: AlSafe API - Sistema de Gestão de Voos
  version: 1.0
  description: |
    Especificação OpenAPI unificada para o ecossistema AlSafe.
    Inclui WP1 (Gestão de Aeronaves) e WP2 (Gestão de Aeroportos).
servers:
  - url: http://localhost:8080
    description: Servidor de Desenvolvimento Local

paths:
  /api/auth/login:
    post:
      summary: Autenticar um utilizador do sistema (Admin / Operator)
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "admin"
                password:
                  type: string
                  example: "admin123"
      responses:
        '200':
          description: Autenticação efetuada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: "Autenticação realizada com sucesso!"
                  username:
                    type: string
                    example: "admin"
                  role:
                    type: string
                    example: "ADMIN"
        '401':
          description: Credenciais inválidas ou utilizador não encontrado.

  /api/airports:
    post:
      summary: Registar um novo aeroporto (US106)
      operationId: registerAirport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Airport'
      responses:
        '201':
          description: Aeroporto criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Airport'
        '400':
          description: Erro de validação nos dados ou código IATA já existente.

  /api/airports/{iataCode}:
    get:
      summary: Consultar detalhes de um aeroporto específico (US107)
      operationId: getAirportDetails
      parameters:
        - name: iataCode
          in: path
          required: true
          description: Código IATA de 3 letras do aeroporto (ex. LIS, OPO)
          schema:
            type: string
            minLength: 3
            maxLength: 3
      responses:
        '200':
          description: Detalhes do aeroporto encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Airport'
        '404':
          description: Aeroporto não encontrado.

  /api/airports/{iataCode}/status:
    patch:
      summary: Atualizar o estado operacional de um aeroporto (US109)
      operationId: updateAirportStatus
      parameters:
        - name: iataCode
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: true
          description: Novo estado do aeroporto
          schema:
            type: string
            enum:
              - OPERATIONAL
              - CLOSED
              - MAINTENANCE
      responses:
        '200':
          description: Estado atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Airport'
        '404':
          description: Aeroporto não encontrado.

  /api/aircraft-models:
    post:
      summary: Registar modelo de aeronave com imagem opcional (US101 + US202)
      operationId: registerAircraftModel
      description: Regista um novo modelo, suportando o upload de um ficheiro de imagem ou diagrama técnico via multipart/form-data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                model:
                  type: object
                  description: Objeto JSON com os dados do modelo (manufacturer, modelName, etc.)
                image:
                  type: string
                  format: binary
                  description: Ficheiro de imagem opcional (JPG, PNG)
      responses:
        '201':
          description: Modelo registado com sucesso
        '400':
          description: Erro na validação dos dados

  /api/aircraft-models/{id}:
    patch:
      summary: Atualizar especificações de um modelo de aeronave (US201)
      operationId: updateAircraftModelSpecs
      description: Atualiza campos específicos (alcance, velocidade, etc.) de um modelo existente.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manufacturer:
                  type: string
                modelName:
                  type: string
                cruisingSpeed:
                  type: number
                  format: float
                fuelCapacity:
                  type: number
                  format: float
                maxRange:
                  type: number
                  format: float
      responses:
        '200':
          description: Modelo atualizado com sucesso
        '400':
          description: Dados inválidos (ex. valores negativos)
        '404':
          description: Modelo não encontrado

  /api/aircrafts:
    post:
      summary: Registar uma nova aeronave (US102)
      operationId: registerAircraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAircraftRequest'
      responses:
        '201':
          description: Aeronave criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aircraft'
        '400':
          description: Erro de validação ou matrícula já existente.

    get:
      summary: Pesquisar aeronaves com filtros (US104)
      operationId: searchAircrafts
      parameters:
        - name: modelName
          in: query
          required: false
          description: Filtrar pelo nome do modelo (ex. 737 MAX 8)
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filtrar pelo estado operacional
          schema:
            type: string
            enum:
              - ACTIVE
              - IN_FLIGHT
              - UNDER_MAINTENANCE
              - INACTIVE
        - name: year
          in: query
          required: false
          description: Filtrar pelo ano de fabrico (ex. 2023)
          schema:
            type: integer
      responses:
        '200':
          description: Lista de aeronaves que correspondem aos filtros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Aircraft'

  /api/aircrafts/availability-report:
    get:
      summary: Obter relatório de disponibilidade da frota (US205)
      operationId: getFleetAvailabilityStatus
      description: Retorna um resumo agregado da quantidade de aeronaves em cada estado em tempo real.
      responses:
        '200':
          description: Relatório gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
                example:
                  ACTIVE: 2
                  UNDER_MAINTENANCE: 1
                  IN_FLIGHT: 1
                  INACTIVE: 0

  /api/aircrafts/operational-hours:
    get:
      summary: Calcular total de horas operacionais da frota (US206)
      operationId: getFleetOperationalHours
      description: Retorna um mapa com a matrícula de cada aeronave e o seu respetivo total de horas de voo.
      responses:
        '200':
          description: Horas operacionais retornadas com sucesso
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
                  format: double
                example:
                  "CS-TKA": 125.5
                  "CS-XPTO": 40.0

  /api/aircrafts/{registrationNumber}:
    get:
      summary: Consultar detalhes de uma aeronave específica (US103)
      operationId: getAircraftDetails
      parameters:
        - name: registrationNumber
          in: path
          required: true
          description: Matrícula única da aeronave (ex. CS-TKA)
          schema:
            type: string
      responses:
        '200':
          description: Detalhes da aeronave encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aircraft'
        '404':
          description: Aeronave não encontrada.

  /api/aircrafts/{registrationNumber}/status:
    patch:
      summary: Atualizar o estado operacional de uma aeronave (US105)
      operationId: updateAircraftStatus
      parameters:
        - name: registrationNumber
          in: path
          required: true
          description: Matrícula única da aeronave
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - IN_FLIGHT
                    - UNDER_MAINTENANCE
                    - INACTIVE
                  example: "UNDER_MAINTENANCE"
      responses:
        '200':
          description: Estado atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aircraft'
        '404':
          description: Aeronave não encontrada.

  /api/aircrafts/{registrationNumber}/compatible-routes:
    get:
      summary: Ver rotas compatíveis com uma aeronave (US203)
      operationId: getCompatibleRoutes
      description: Retorna uma lista de rotas ativas cujo alcance e capacidade exigidos são suportados.
      parameters:
        - name: registrationNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de rotas compatíveis retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '404':
          description: Aeronave não encontrada

  /api/aircrafts/{registrationNumber}/add-hours:
    patch:
      summary: "[TESTE] Adicionar horas operacionais"
      operationId: addOperationalHours
      description: Endpoint auxiliar para injetar horas de voo numa aeronave para demonstração da US206.
      parameters:
        - name: registrationNumber
          in: path
          required: true
          schema:
            type: string
        - name: hours
          in: query
          required: true
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Horas adicionadas com sucesso
        '400':
          description: Valor de horas inválido
        '404':
          description: Aeronave não encontrada

components:
  schemas:
    Airport:
      type: object
      required:
        - iataCode
        - name
        - city
        - country
      properties:
        id:
          type: integer
          example: 1
          description: Identificador único gerado automaticamente pela base de dados.
        iataCode:
          type: string
          minLength: 3
          maxLength: 3
          pattern: '^[A-Z]{3}$'
          example: "MAD"
          description: Código único do aeroporto com exatamente 3 letras.
        name:
          type: string
          example: "Aeroporto Cristiano Ronaldo"
        city:
          type: string
          example: "Madeira"
        country:
          type: string
          example: "Portugal"
        airportType:
          type: string
          example: "comercial"
        status:
          type: string
          example: "OPERATIONAL"
        certifiedAirplaneModels:
          type: array
          items:
            type: string
          example:
            - "A320"
            - "B737"

    AircraftModel:
      type: object
      required:
        - manufacturer
        - modelName
        - cruisingSpeed
        - fuelCapacity
        - maxRange
      properties:
        id:
          type: integer
          example: 1
          description: ID gerado automaticamente.
        manufacturer:
          type: string
          example: "Boeing"
        modelName:
          type: string
          example: "737 MAX 8"
        cruisingSpeed:
          type: number
          format: float
          example: 839.0
        fuelCapacity:
          type: number
          format: float
          example: 25941.0
        maxRange:
          type: number
          format: float
          example: 6570.0
        image:
          type: string
          format: byte
          description: Imagem opcional do modelo convertida em Base64

    Aircraft:
      type: object
      properties:
        id:
          type: integer
          example: 1
        registrationNumber:
          type: string
          example: "CS-TKA"
        manufacturingDate:
          type: string
          format: date
          example: "2023-01-15"
        seatingCapacity:
          type: integer
          example: 189
        status:
          type: string
          example: "ACTIVE"
        totalOperationalHours:
          type: number
          format: double
          example: 125.5
        aircraftModel:
          $ref: '#/components/schemas/AircraftModel'

    CreateAircraftRequest:
      type: object
      required:
        - registrationNumber
        - manufacturingDate
        - seatingCapacity
        - status
        - modelId
      properties:
        registrationNumber:
          type: string
          example: "CS-TKA"
        manufacturingDate:
          type: string
          format: date
          example: "2023-01-15"
        seatingCapacity:
          type: integer
          example: 189
        status:
          type: string
          enum:
            - ACTIVE
            - IN_FLIGHT
            - UNDER_MAINTENANCE
            - INACTIVE
          example: "ACTIVE"
        modelId:
          type: integer
          example: 1
          description: ID do modelo de aeronave associado.